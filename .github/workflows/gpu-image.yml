name: GPU image

# Publishes the RunPod endpoint image (backend/deployment/gpu) to GitHub's container
# registry, as ghcr.io/<owner>/image-tools-gpu:latest and :<commit>.
on:
  push:
    branches: [main]
    paths:
      - "backend/config/**"
      - "backend/core/**"
      - "backend/services/**"
      - "backend/gpu_handler.py"
      - "backend/requirements/gpu.txt"
      - "backend/deployment/gpu/**"
      - ".github/workflows/gpu-image.yml"
  workflow_dispatch:

concurrency:
  group: gpu-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      # CUDA, PyTorch and the baked-in models need more room than the runner has free
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/image-tools-gpu" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/deployment/gpu/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          # Read token for gated model downloads (FLUX.1 Kontext for the watermark remover)
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
