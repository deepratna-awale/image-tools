version: '3.8'

services:
  # API Service
  api:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
      target: production
    ports:
      - "8000:8000"
    environment:
      - QUEUE_TYPE=sqs
      - STORAGE_TYPE=s3
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - SQS_QUEUE_URL=${SQS_QUEUE_URL}
      - DEBUG=false
      - LOG_LEVEL=INFO
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    restart: unless-stopped

  # Worker Service
  worker:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
      target: production
    environment:
      - QUEUE_TYPE=sqs
      - STORAGE_TYPE=s3
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - SQS_QUEUE_URL=${SQS_QUEUE_URL}
      - LOG_LEVEL=INFO
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    restart: unless-stopped
    command: python -m workers.image_processor

networks:
  default:
    driver: bridge
